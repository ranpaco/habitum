AWSTemplateFormatVersion: "2010-09-09"
Description: GitHub Actions OIDC deploy role for Habitum dev continuous deployment.

Parameters:
  GitHubOrg:
    Type: String
    Default: ranpaco
  GitHubRepo:
    Type: String
    Default: habitum
  BranchName:
    Type: String
    Default: main
  ProjectName:
    Type: String
    Default: habitum
  Environment:
    Type: String
    Default: dev
  CreateOidcProvider:
    Type: String
    Default: "true"
    AllowedValues:
      - "true"
      - "false"
    Description: Set to false if token.actions.githubusercontent.com already exists in this AWS account.

Conditions:
  ShouldCreateOidcProvider: !Equals [!Ref CreateOidcProvider, "true"]

Resources:
  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: ShouldCreateOidcProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList:
        - sts.amazonaws.com
      ThumbprintList:
        - 6938fd4d98bab03faadb97b34396831e3780aea1

  GitHubActionsDeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ProjectName}-${Environment}-github-actions-deploy"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Sub "arn:aws:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com"
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
              StringLike:
                token.actions.githubusercontent.com:sub: !Sub "repo:${GitHubOrg}/${GitHubRepo}:ref:refs/heads/${BranchName}"
      Policies:
        - PolicyName: !Sub "${ProjectName}-${Environment}-github-actions-deploy-policy"
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: CloudFormationDeploy
                Effect: Allow
                Action:
                  - cloudformation:CreateChangeSet
                  - cloudformation:CreateStack
                  - cloudformation:DeleteChangeSet
                  - cloudformation:DescribeChangeSet
                  - cloudformation:DescribeStackEvents
                  - cloudformation:DescribeStacks
                  - cloudformation:ExecuteChangeSet
                  - cloudformation:GetTemplateSummary
                  - cloudformation:UpdateStack
                Resource:
                  - !Sub "arn:aws:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${ProjectName}-${Environment}-backend/*"
                  - !Sub "arn:aws:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${ProjectName}-${Environment}-web/*"
              - Sid: ArtifactBucketManagement
                Effect: Allow
                Action:
                  - s3:CreateBucket
                  - s3:GetBucketLocation
                  - s3:HeadBucket
                  - s3:ListBucket
                  - s3:PutBucketCors
                  - s3:PutBucketEncryption
                  - s3:PutBucketLifecycleConfiguration
                  - s3:PutBucketPublicAccessBlock
                Resource:
                  - !Sub "arn:aws:s3:::${ProjectName}-${Environment}-artifacts-${AWS::AccountId}-${AWS::Region}"
                  - !Sub "arn:aws:s3:::${ProjectName}-${Environment}-uploads-${AWS::AccountId}-${AWS::Region}"
                  - !Sub "arn:aws:s3:::${ProjectName}-${Environment}-web-${AWS::AccountId}-${AWS::Region}"
              - Sid: S3ObjectDeploy
                Effect: Allow
                Action:
                  - s3:DeleteObject
                  - s3:GetObject
                  - s3:PutObject
                Resource:
                  - !Sub "arn:aws:s3:::${ProjectName}-${Environment}-artifacts-${AWS::AccountId}-${AWS::Region}/*"
                  - !Sub "arn:aws:s3:::${ProjectName}-${Environment}-uploads-${AWS::AccountId}-${AWS::Region}/*"
                  - !Sub "arn:aws:s3:::${ProjectName}-${Environment}-web-${AWS::AccountId}-${AWS::Region}/*"
              - Sid: WebBucketCloudFormation
                Effect: Allow
                Action:
                  - s3:GetBucketPolicy
                  - s3:PutBucketCors
                  - s3:PutBucketEncryption
                  - s3:PutBucketLifecycleConfiguration
                  - s3:PutBucketPolicy
                  - s3:PutPublicAccessBlock
                Resource:
                  - !Sub "arn:aws:s3:::${ProjectName}-${Environment}-uploads-${AWS::AccountId}-${AWS::Region}"
                  - !Sub "arn:aws:s3:::${ProjectName}-${Environment}-web-${AWS::AccountId}-${AWS::Region}"
              - Sid: LambdaDeploy
                Effect: Allow
                Action:
                  - lambda:AddPermission
                  - lambda:CreateFunction
                  - lambda:GetFunction
                  - lambda:GetFunctionConfiguration
                  - lambda:RemovePermission
                  - lambda:UpdateFunctionCode
                  - lambda:UpdateFunctionConfiguration
                Resource: !Sub "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${ProjectName}-${Environment}-api"
              - Sid: ApiGatewayDeploy
                Effect: Allow
                Action:
                  - apigateway:DELETE
                  - apigateway:GET
                  - apigateway:PATCH
                  - apigateway:POST
                  - apigateway:PUT
                Resource: "*"
              - Sid: DynamoDbDeploy
                Effect: Allow
                Action:
                  - dynamodb:CreateTable
                  - dynamodb:DescribeTable
                  - dynamodb:TagResource
                  - dynamodb:UpdateTable
                Resource:
                  - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${ProjectName}-${Environment}-demo-requests"
                  - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${ProjectName}-${Environment}-onboarding-sessions"
                  - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${ProjectName}-${Environment}-communities"
                  - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${ProjectName}-${Environment}-uploaded-files"
                  - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${ProjectName}-${Environment}-processing-jobs"
              - Sid: LogsDeploy
                Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:DeleteRetentionPolicy
                  - logs:DescribeLogGroups
                  - logs:PutRetentionPolicy
                  - logs:TagResource
                Resource: !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${ProjectName}-${Environment}-api:*"
              - Sid: IamDeploy
                Effect: Allow
                Action:
                  - iam:AttachRolePolicy
                  - iam:CreateRole
                  - iam:DeleteRolePolicy
                  - iam:GetRole
                  - iam:GetRolePolicy
                  - iam:PassRole
                  - iam:PutRolePolicy
                  - iam:TagRole
                  - iam:UpdateAssumeRolePolicy
                Resource: !Sub "arn:aws:iam::${AWS::AccountId}:role/${ProjectName}-${Environment}-api-role"
              - Sid: CloudFrontDeploy
                Effect: Allow
                Action:
                  - cloudfront:CreateCloudFrontOriginAccessIdentity
                  - cloudfront:CreateDistribution
                  - cloudfront:CreateInvalidation
                  - cloudfront:CreateOriginAccessControl
                  - cloudfront:GetDistribution
                  - cloudfront:GetDistributionConfig
                  - cloudfront:GetInvalidation
                  - cloudfront:GetOriginAccessControl
                  - cloudfront:TagResource
                  - cloudfront:UpdateDistribution
                Resource: "*"

Outputs:
  RoleArn:
    Description: GitHub Actions OIDC deploy role ARN.
    Value: !GetAtt GitHubActionsDeployRole.Arn
